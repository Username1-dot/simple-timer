<body></body>

    <a href="index.html" style="margin: 0px; color: black;">Exam Timer</a>

<p id="timerName"></p>
<p id="timer"></p>
<input type="button" onclick="startPressed()" value="Start" id="start">
<input type="button" onclick="stopPressed()" value="Stop" id="stop">
<input type="button" onclick="resetPressed()" value="Reset" id="reset">
<hr>
<input type="button" onclick="prevPressed()" value = "< Previous" id="previous">
<input type="button" onclick="nextPressed()" value = "Next >" id="next">
<br>
<input type="checkbox" id="autoplay">
<label for="autoplay">Autoplay Timers</label>
<br>
<p id="wordClock"></p>
